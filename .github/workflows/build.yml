name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      play:
        description: Also upload this version's bundle to Google Play
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Bundle the game
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: no-paddle-web
          path: dist/index.html

  android:
    name: Android APK and bundle
    needs: test
    runs-on: ubuntu-latest
    env:
      # The Play upload key, if the repository has all of it (see docs/PLAY_STORE.md).
      # Without all four secrets the APK still ships; only the .aab is left out.
      UPLOAD_KEY: ${{ secrets.BOATIFY_UPLOAD_KEYSTORE != '' && secrets.BOATIFY_KEYSTORE_PASSWORD != '' && secrets.BOATIFY_KEY_ALIAS != '' && secrets.BOATIFY_KEY_PASSWORD != '' }}
      # A Play Console service account, if the repository has one: then each
      # new version's bundle goes straight to the Play track (docs/PLAY_STORE.md).
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
      - name: Unpack the upload key
        if: env.UPLOAD_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.BOATIFY_UPLOAD_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build release bundle for Google Play
        working-directory: android
        env:
          BOATIFY_KEYSTORE_FILE: ${{ env.UPLOAD_KEY == 'true' && format('{0}/upload.keystore', runner.temp) || '' }}
          BOATIFY_KEYSTORE_PASSWORD: ${{ secrets.BOATIFY_KEYSTORE_PASSWORD }}
          BOATIFY_KEY_ALIAS: ${{ secrets.BOATIFY_KEY_ALIAS }}
          BOATIFY_KEY_PASSWORD: ${{ secrets.BOATIFY_KEY_PASSWORD }}
          # Real AdMob ids for the Play bundle only; the APK above keeps
          # Google's test ids so a sideloaded build never serves real ads.
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_TEST_DEVICE_IDS: ${{ secrets.ADMOB_TEST_DEVICE_IDS }}
        run: ./gradlew bundleRelease --stacktrace
      - name: Name the APK and bundle
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/no-paddle-v${VERSION}.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=out/no-paddle-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          # A bundle signed with the public development key must never reach Play.
          if [ "$UPLOAD_KEY" = "true" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/no-paddle-v${VERSION}.aab"
            echo "bundle=out/no-paddle-v${VERSION}.aab" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: no-paddle-v${{ steps.apk.outputs.version }}-android
          path: out/
      - name: Publish pre-release
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          FILE: ${{ steps.apk.outputs.file }}
          BUNDLE: ${{ steps.apk.outputs.bundle }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in package.json to publish a new one."
          else
            node scripts/release-notes.mjs "$VERSION" ${BUNDLE:+--bundle} > notes.md
            gh release create "$TAG" "$FILE" $BUNDLE --target "$GITHUB_SHA" --title "No Paddle $TAG" --notes-file notes.md --prerelease
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      # Only from main, only with the upload-key bundle, and only for a version
      # that is new (just released) or when asked for by hand.
      - name: Release notes for Google Play
        id: play
        if: env.PLAY_UPLOAD == 'true' && github.ref == 'refs/heads/main' && steps.apk.outputs.bundle != '' && (steps.release.outputs.created == 'true' || inputs.play)
        env:
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          CODE=$(node -p "const [a, b, c] = process.env.VERSION.split('.').map(Number); a * 10000 + b * 100 + c")
          mkdir -p out/whatsnew
          for NOTES in fastlane/metadata/android/*/changelogs/${CODE}.txt; do
            [ -f "$NOTES" ] || continue
            LOCALE=$(basename "$(dirname "$(dirname "$NOTES")")")
            cp "$NOTES" "out/whatsnew/whatsnew-${LOCALE}"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload to Google Play
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.manpreetgugga.boatify
          releaseFiles: ${{ steps.apk.outputs.bundle }}
          releaseName: v${{ steps.apk.outputs.version }}
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: completed
          whatsNewDirectory: out/whatsnew
